services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bupt_compass
      MYSQL_USER: bupt
      MYSQL_PASSWORD: ${BUPT_MYSQL_PASSWORD:-bupt-local-only}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - bupt_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  bupt_mysql:
